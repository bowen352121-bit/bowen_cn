<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 · 魔方立体 · 持续练习</title>
  <link rel="stylesheet" href="../../click-effect.css?v=20260620">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020306;
      color: #e8e8e8;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #canvas-wrap {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 85% 75% at 50% 42%, #1a2838 0%, #0c121c 42%, #060a12 72%, #020306 100%);
    }

    #cube-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #canvas-wrap.dragging #cube-canvas { cursor: grabbing; }

    .scan-hud {
      position: absolute;
      left: 50%;
      top: 46%;
      width: min(70vmin, 520px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
      opacity: 0.75;
    }

    .scan-hud circle,
    .scan-hud line {
      fill: none;
      stroke: rgba(255, 255, 255, 0.12);
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: linear-gradient(to bottom, rgba(2, 6, 12, 0.85), transparent);
      pointer-events: none;
    }

    .top-bar a {
      pointer-events: auto;
      color: rgba(255, 255, 255, 0.72);
      text-decoration: none;
      font-size: 0.875rem;
      letter-spacing: 0.04em;
    }

    .top-bar a:hover { color: #fff; }

    .top-tag {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.38);
      text-transform: uppercase;
    }

    .hint {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.32);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap">
      <svg class="scan-hud" viewBox="0 0 400 400" aria-hidden="true">
        <circle cx="200" cy="200" r="168" stroke-width="0.7" stroke-dasharray="5 12" opacity="0.5"/>
        <circle cx="200" cy="200" r="148" stroke-width="0.4" stroke-dasharray="2 9" opacity="0.35"/>
        <line x1="200" y1="28" x2="200" y2="52" stroke-width="0.55"/>
        <line x1="200" y1="348" x2="200" y2="372" stroke-width="0.55"/>
        <line x1="28" y1="200" x2="52" y2="200" stroke-width="0.55"/>
        <line x1="348" y1="200" x2="372" y2="200" stroke-width="0.55"/>
      </svg>
      <canvas id="cube-canvas"></canvas>
      <p class="hint">DRAG TO ROTATE · 拖拽旋转 · 白色像素点 + 棱线</p>
    </div>

    <div class="top-bar">
      <a href="../suixi.html">← 持续练习</a>
      <span class="top-tag">02 / RUBIK · PIXEL MESH</span>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "../../vendor/three/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { initRubikCubeScene } from "./rubik-cube.js";
    initRubikCubeScene({
      canvas: document.getElementById("cube-canvas"),
      wrap: document.getElementById("canvas-wrap"),
    });
  </script>
  <script src="../../click-effect.js?v=20260620"></script>
</body>
</html>
